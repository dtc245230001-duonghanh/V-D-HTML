<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập - CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 style="text-align: center; margin: 20px 0;">So Sánh content-box Và border-box</h1>

    <!-- Thẻ thứ 1: content-box (Xanh lá) -->
    <div class="card">
        <h3>Thẻ 1 (content-box)</h3>
        <p>Kích thước thẻ bị cộng thêm bởi padding và border.</p>
    </div>

    <!-- Thẻ thứ 2: border-box (Vàng) -->
    <div class="card">
        <h3>Thẻ 2 (border-box)</h3>
        <p>Kích thước tổng giữ nguyên 280px × 150px.</p>
    </div>

    <!-- Thẻ thứ 3: border-box (Đỏ) -->
    <div class="card">
        <h3>Thẻ 3 (border-box)</h3>
        <p>Giữ nguyên kích thước chuẩn như Thẻ 2.</p>
    </div>

</body>
</html>
