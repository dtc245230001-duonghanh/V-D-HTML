<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <h1 class="title">Responsive Image Gallery</h1>

    <div class="gallery">
        <div class="responsive">
            <div class="gallery-item">
                <img src="https://picsum.photos/600/400?random=1" alt="Hình ảnh 1">
                <div class="desc">Mô tả hình ảnh 1</div>
            </div>
        </div>

        <div class="responsive">
            <div class="gallery-item">
                <img src="https://picsum.photos/600/400?random=2" alt="Hình ảnh 2">
                <div class="desc">Mô tả hình ảnh 2</div>
            </div>
        </div>

        <div class="responsive">
            <div class="gallery-item">
                <img src="https://picsum.photos/600/400?random=3" alt="Hình ảnh 3">
                <div class="desc">Mô tả hình ảnh 3</div>
            </div>
        </div>

        <div class="responsive">
            <div class="gallery-item">
                <img src="https://picsum.photos/600/400?random=4" alt="Hình ảnh 4">
                <div class="desc">Mô tả hình ảnh 4</div>
            </div>
        </div>
    </div>

</body>
</html>
