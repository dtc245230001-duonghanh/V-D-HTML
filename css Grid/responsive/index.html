<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Bố cục Responsive bằng CSS Grid</title>
    <link rel="stylesheet" href="grid_layout.css">
</head>
<body>

    <div class="grid-container">
        <header class="header">
            <h1>My Website Header</h1>
        </header>

        <nav class="nav">
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Bài viết</a></li>
                <li><a href="#">Dịch vụ</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
        </nav>

        <main class="main">
            <h2>Main Content</h2>
            <p>Đây là khu vực hiển thị nội dung chính của trang web. Bố cục này được xây dựng hoàn toàn bằng CSS Grid linh hoạt.</p>
        </main>

        <aside class="sidebar">
            <h3>Sidebar</h3>
            <p>Nội dung phụ, tin nổi bật hoặc quảng cáo.</p>
        </aside>

        <footer class="footer">
