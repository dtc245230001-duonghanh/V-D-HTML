<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 32px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h2 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            height: 48px; /* Fitts' Law: Ô nhập liệu kích thước đủ lớn */
            padding: 0 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #00adee;
            box-shadow: 0 0 0 3px rgba(0, 173, 238, 0.15);
        }

        /* Nút bấm áp dụng Fitts' Law */
        .btn-submit {
            width: 100%;
            height: 50px; /* Chiều cao đủ lớn, dễ thao tác chạm/click */
            background-color: #00adee;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #0088bc;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .footer-text a {
            color: #00adee;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Tạo tài khoản mới</h2>
            <p>Vui lòng điền đầy đủ thông tin bên dưới</p>
        </div>

        <!-- Chuyển sang success.html khi bấm Đăng ký -->
        <form action="success.html" method="GET">
            <div class="form-group">
                <label for="fullname">Họ và tên *</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên của bạn" required>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu *</label>
                <input type="password" id="password" name="password" placeholder="Tối thiểu 8 ký tự" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Xác nhận mật khẩu *</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Nhập lại mật khẩu" required>
            </div>

            <button type="submit" class="btn-submit">Đăng ký ngay</button>
        </form>

        <div class="footer-text">
            Bạn đã có tài khoản? <a href="#">Đăng nhập</a>
        </div>
    </div>

</body>
</html>
