<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS flex-flow Property</title>
    <link rel="stylesheet" href="flex_flow.css">
</head>
<body>

    <h1 class="page-title">Thực hành Thuộc tính CSS `flex-flow`</h1>

    <!-- Ví dụ 1: row nowrap -->
    <section class="card">
        <h2>Ví dụ 1: flex-flow: row nowrap (Mặc định)</h2>
        <p class="desc">Sắp xếp các item theo hàng ngang từ trái sang phải và không xuống dòng.</p>
        <div class="container-1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </section>

    <!-- Ví dụ 2: row-reverse nowrap -->
    <section class="card">
        <h2>Ví dụ 2: flex-flow: row-reverse nowrap</h2>
        <p class="desc">Sắp xếp các item theo hàng ngang từ phải sang trái và không xuống dòng.</p>
        <div class="container-2">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </section>

</body>
</html>
